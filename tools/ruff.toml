# Tooling scripts have no pyproject of their own, so without this file Ruff
# applies its built-in default rule set here, which Ruff 0.16 widened from 59
# to 400+ rules. Pin the pre-0.16 defaults so a Ruff upgrade cannot silently
# change what CI enforces for tools/.
[lint]
select = ["E4", "E7", "E9", "F"]
