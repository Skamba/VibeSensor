# install_systemd_units.sh installs this as
# /etc/systemd/journald.conf.d/90-vibesensor.conf.
#
# Raspberry Pi OS keeps the system journal in RAM (Storage=volatile in
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf), so a drive's
# logs are gone after the next power cut, which in a car is every stop. Keep
# them on the SD card instead; this file sorts after 40- and wins. Small and
# SD friendly: at most 32 MB in 8 MB files, no debug messages, and journald's
# default 5-minute sync (it syncs at once after a critical message, such as
# the kernel's "Undervoltage detected!").
[Journal]
Storage=persistent
SystemMaxUse=32M
SystemMaxFileSize=8M
MaxLevelStore=info
