name: guided-brake-stops
description: Guided test drive with the brake step (sweep, hold, three firm stops from 100 to 40 km/h) and a front-left wheel imbalance that shakes whether or not the car brakes.
phases:
- name: sweep
  guided_phase: sweep
  duration_s: 8.0
  speed_start_kmh: 50.0
  speed_end_kmh: 100.0
  overrides:
  - target: all
    profile_name: rough_road
    scene_gain: 0.28
    scene_noise_gain: 1.0
    amp_scale: 0.52
    noise_scale: 1.0
  - target: front-left
    profile_name: wheel_imbalance
    scene_gain: 0.85
    scene_noise_gain: 1.0
    amp_scale: 1.0
    noise_scale: 1.0
  - target: front-right
    profile_name: wheel_mild_imbalance
    scene_gain: 0.3
    scene_noise_gain: 1.0
    amp_scale: 0.55
    noise_scale: 1.0
  pulses: []
