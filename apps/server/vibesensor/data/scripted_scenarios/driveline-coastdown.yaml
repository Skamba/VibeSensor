name: driveline-coastdown
description: Clean pull, then a driveshaft rumble at the rear axle during the coastdown.
phases:
- name: pull
  duration_s: 6.0
  speed_start_kmh: 42.0
  speed_end_kmh: 96.0
  overrides:
  - target: all
    profile_name: rough_road
    scene_gain: 0.34
    scene_noise_gain: 1.02
    amp_scale: 0.6
    noise_scale: 1.0
  - target: body
    profile_name: rear_body
    scene_gain: 0.42
    scene_noise_gain: 1.0
    amp_scale: 0.74
    noise_scale: 1.0
  pulses:
  - at_s: 2.5
    target: rear-axle
    strength: 0.22
- name: pull-hold
  duration_s: 3.0
  speed_start_kmh: 96.0
  speed_end_kmh: 96.0
  overrides:
  - target: all
    profile_name: rough_road
    scene_gain: 0.34
    scene_noise_gain: 1.02
    amp_scale: 0.6
    noise_scale: 1.0
  - target: body
    profile_name: rear_body
    scene_gain: 0.42
    scene_noise_gain: 1.0
    amp_scale: 0.74
    noise_scale: 1.0
  pulses: []
- name: coast-rumble
  duration_s: 6.0
  speed_start_kmh: 96.0
  speed_end_kmh: 84.0
  overrides:
  - target: all
    profile_name: rough_road
    scene_gain: 0.34
    scene_noise_gain: 1.04
    amp_scale: 0.6
    noise_scale: 1.02
  - target: rear-axle
    profile_name: driveshaft_imbalance
    scene_gain: 0.62
    scene_noise_gain: 1.06
    amp_scale: 0.88
    noise_scale: 1.04
  - target: body
    profile_name: driveshaft_imbalance
    scene_gain: 0.48
    scene_noise_gain: 1.04
    amp_scale: 0.8
    noise_scale: 1.02
  pulses:
  - at_s: 1.8
    target: rear-axle
    strength: 0.42
  - at_s: 4.7
    target: all
    strength: 0.24
  - at_s: 6.0
    target: body
    strength: 0.3
- name: coast-hold
  duration_s: 3.0
  speed_start_kmh: 84.0
  speed_end_kmh: 84.0
  overrides:
  - target: all
    profile_name: rough_road
    scene_gain: 0.34
    scene_noise_gain: 1.04
    amp_scale: 0.6
    noise_scale: 1.02
  - target: rear-axle
    profile_name: driveshaft_imbalance
    scene_gain: 0.62
    scene_noise_gain: 1.06
    amp_scale: 0.88
    noise_scale: 1.04
  - target: body
    profile_name: driveshaft_imbalance
    scene_gain: 0.48
    scene_noise_gain: 1.04
    amp_scale: 0.8
    noise_scale: 1.02
  pulses: []
- name: settled-roll
  duration_s: 5.0
  speed_start_kmh: 84.0
  speed_end_kmh: 34.0
  overrides:
  - target: all
    profile_name: rough_road
    scene_gain: 0.24
    scene_noise_gain: 0.98
    amp_scale: 0.48
    noise_scale: 0.98
  - target: body
    profile_name: rear_body
    scene_gain: 0.3
    scene_noise_gain: 0.98
    amp_scale: 0.58
    noise_scale: 0.98
  pulses: []
