name: Main Release

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Validate manual release source
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          echo "Manual release workflow runs must use the main branch; got ${GITHUB_REF}." >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # workflow_run releases must build the exact commit that completed CI successfully.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Compute release source SHA
        id: release_source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up configured Python runtime
        id: setup-python
        uses: ./.github/actions/setup-python

      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python_bin="${{ steps.setup-python.outputs.python-path }}"
          "${python_bin}" tools/release/main_release.py compute-version \
            --github-output "${GITHUB_OUTPUT}"

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Build UI
        shell: bash
        run: |
          set -euo pipefail
          python_bin="${{ steps.setup-python.outputs.python-path }}"
          "${python_bin}" tools/build_ui_static.py

      - name: Stamp version and build server wheel
        shell: bash
        run: |
          set -euo pipefail
          python_bin="${{ steps.setup-python.outputs.python-path }}"
          "${python_bin}" tools/release/main_release.py build-wheel \
            --version "${{ steps.version.outputs.version }}"

      - name: Validate built server wheel metadata
        shell: bash
        run: |
          set -euo pipefail
          python_bin="${{ steps.setup-python.outputs.python-path }}"
          wheel_path="$(echo apps/server/dist/*.whl)"
          PYTHONPATH=apps/server "${python_bin}" -m vibesensor.use_cases.updates.releases.release_validation validate-wheel-metadata \
            --wheel-path "${wheel_path}" \
            --expected-version "${{ steps.version.outputs.version }}"

      - name: Smoke-validate built server wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(echo apps/server/dist/*.whl)"
          python_bin="${{ steps.setup-python.outputs.python-path }}"
          "${python_bin}" tools/tests/run_release_smoke.py \
            --skip-ui-build \
            --wheel-path "${wheel_path}" \
            --config apps/server/config.dev.yaml \
            --host 127.0.0.1 \
            --port 18080

      - name: Install PlatformIO
        shell: bash
        run: |
          set -euo pipefail
          python_bin="${{ steps.setup-python.outputs.python-path }}"
          "${python_bin}" -m pip install pipx
          "${python_bin}" -m pipx ensurepath
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${python_bin}" -m pipx install platformio

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          cd "firmware/esp"
          pio run

      - name: Package firmware artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "firmware/esp"
          mkdir -p dist

          mapfile -t firmware_bins < <(find .pio/build -mindepth 2 -maxdepth 2 -type f -name firmware.bin | sort)
          if [ "${#firmware_bins[@]}" -eq 0 ]; then
            echo "No firmware.bin found under .pio/build." >&2
            exit 1
          fi

          for firmware_bin in "${firmware_bins[@]}"; do
            env_dir="$(dirname "${firmware_bin}")"
            env_name="$(basename "${env_dir}")"
            target_dir="dist/${env_name}"
            mkdir -p "${target_dir}"

            cp "${env_dir}/firmware.bin" "${target_dir}/firmware.bin"
            if [ -f "${env_dir}/bootloader.bin" ]; then
              cp "${env_dir}/bootloader.bin" "${target_dir}/bootloader.bin"
            fi
            if [ -f "${env_dir}/partitions.bin" ]; then
              cp "${env_dir}/partitions.bin" "${target_dir}/partitions.bin"
            fi
            if [ -f "${env_dir}/boot_app0.bin" ]; then
              cp "${env_dir}/boot_app0.bin" "${target_dir}/boot_app0.bin"
            fi
          done

      - name: Generate flash manifest
        shell: bash
        run: |
          set -euo pipefail
          python_bin="${{ steps.setup-python.outputs.python-path }}"
          "${python_bin}" tools/release/main_release.py generate-firmware-manifest \
            --firmware-dir "firmware/esp" \
            --generated-from "${{ steps.release_source.outputs.sha }}"

      - name: Validate firmware manifest
        shell: bash
        run: |
          set -euo pipefail
          python_bin="${{ steps.setup-python.outputs.python-path }}"
          PYTHONPATH=apps/server "${python_bin}" -m vibesensor.use_cases.updates.releases.release_validation validate-firmware-manifest \
            --dist-dir "firmware/esp/dist"

      - name: Create firmware bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "firmware/esp"
          bundle_name="${{ steps.version.outputs.bundle }}"
          rm -f "${bundle_name}"
          (cd dist && zip -r "../${bundle_name}" .)
          echo "path=firmware/esp/${bundle_name}" >> "${GITHUB_OUTPUT}"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(git tag -l 'server-v*' --sort=-creatordate | head -n1 || true)"
          if [ -z "${latest_tag}" ]; then
            range="HEAD"
          else
            range="${latest_tag}..HEAD"
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "## Changes"
            echo ""
             git log --oneline --no-decorate --max-count=50 "${range}"
             echo ""
             echo "CHANGELOG_EOF"
           } >> "${GITHUB_OUTPUT}"

      - name: Create combined Wheel / ESP release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          cat > "${notes_file}" <<EOF
          ${{ steps.changelog.outputs.body }}
          EOF

          # compute-version always picks an unused server-v* tag, so this creates a new release.
          gh release create "${{ steps.version.outputs.tag }}" \
            apps/server/dist/*.whl \
            "${{ steps.bundle.outputs.path }}" \
            --target "${{ steps.release_source.outputs.sha }}" \
            --title "Wheel / ESP release ${{ steps.version.outputs.version }}" \
            --notes-file "${notes_file}"

      - name: Remove superseded Wheel / ESP releases
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.version.outputs.tag }}
          WHEEL_ESP_RELEASE_TITLE_PREFIX: Wheel / ESP release
        shell: bash
        run: |
          set -euo pipefail
          python_bin="${{ steps.setup-python.outputs.python-path }}"
          "${python_bin}" tools/release/main_release.py cleanup-releases \
            --repo "${GITHUB_REPOSITORY}" \
            --current-tag "${CURRENT_TAG}" \
            --release-title-prefix "${WHEEL_ESP_RELEASE_TITLE_PREFIX}"
