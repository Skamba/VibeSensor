name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      firmware: ${{ steps.filter.outputs.firmware }}

    steps:
      - uses: actions/checkout@v7

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'apps/server/**'
              - 'tools/**'
              - 'infra/pi-image/**'
              - 'docs/protocol.md'
              - '**/*.sh'
              - '**/*.sh.template'
              - '.githooks/**'
              - 'Makefile'
              - '.python-version'
              - 'docker-compose*.yml'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/ui/**'
              - 'tools/ui/**'
              - 'tools/config/**'
              - 'Makefile'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            firmware:
              - 'firmware/**'
              - 'tools/firmware/**'
              - 'apps/server/vibesensor/adapters/udp/protocol*.py'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - name: Install ShellCheck
        run: command -v shellcheck || { sudo apt-get update && sudo apt-get install -y shellcheck; }

      - name: Dependency consistency
        run: python -m pip check

      - name: Lint (Ruff, ShellCheck, deptry, import layers, config preflight)
        run: make lint

      - name: Type check
        run: make typecheck-backend

      - name: Tests
        run: make test

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: apps/ui
        run: node ../../tools/ui/ensure_ui_bootstrap.mjs

      - name: Format, lint, dead code, dependency boundaries, type check
        run: make ui-typecheck

      - name: Unit tests
        run: make ui-test

  ui-smoke:
    name: UI smoke
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: apps/ui/package-lock.json

      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('apps/ui/package-lock.json') }}

      - name: Install UI dependencies
        working-directory: apps/ui
        run: node ../../tools/ui/ensure_ui_bootstrap.mjs

      - name: Install Playwright Chromium
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        working-directory: apps/ui
        run: npx playwright install chromium

      - name: Playwright smoke tests
        working-directory: apps/ui
        env:
          PLAYWRIGHT_SMOKE_WORKERS: 4
        run: npm run test:smoke

      - name: Upload smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-test-artifacts
          path: apps/ui/test-results/playwright-smoke/
          if-no-files-found: ignore
          retention-days: 5

  integration:
    name: Integration (contracts, e2e, release smoke)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: apps/ui
        run: node ../../tools/ui/ensure_ui_bootstrap.mjs

      - name: Contract drift
        run: |
          make sync-contracts
          git diff --exit-code

      - name: Process-backed e2e suite
        run: make test-e2e

      - name: Release smoke (UI build + packaged wheel)
        run: python tools/tests/run_release_smoke.py

  firmware:
    name: Firmware
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend
        with:
          include-platformio: "true"

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('firmware/esp/platformio.ini') }}

      - name: Verify firmware protocol fixtures
        run: python tools/firmware/generate_protocol_contract_fixtures.py --check

      - name: Native tests
        working-directory: firmware/esp
        run: pio test -e native
