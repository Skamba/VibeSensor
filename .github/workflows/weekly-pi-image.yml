name: Weekly Pi Image

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: Replace the weekly-pi-image GitHub Release (main only). Off = workflow artifact only.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-pi-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}

    steps:
      - name: Require main for published releases
        if: ${{ env.PUBLISH == 'true' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Publishing Pi image releases requires the main branch; got ${GITHUB_REF}." >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - id: setup-python
        uses: ./.github/actions/setup-python

      - name: Install Pi image build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user qemu-user-static rsync xz-utils

      - name: Build Pi image
        env:
          VS_PYTHON_BIN: ${{ steps.setup-python.outputs.python-path }}
        run: ./infra/pi-image/pi-gen/build.sh

      - name: Collect image assets
        id: assets
        run: |
          set -euo pipefail
          out_dir="infra/pi-image/pi-gen/out"
          label="$(date -u +%y-%m-%d)"
          name="VibeSensor-${label}.img.zip"
          release_dir="${RUNNER_TEMP}/pi-image"
          mkdir -p "${release_dir}"

          artifact="$(find "${out_dir}" -maxdepth 1 -type f -name "image_*-vibesensor-lite*.zip" | sort | tail -n 1)"
          if [ -z "${artifact}" ]; then
            echo "No Pi image artifact found in ${out_dir}" >&2
            exit 1
          fi
          cp "${artifact}" "${release_dir}/${name}"
          (cd "${release_dir}" && sha256sum "${name}" > "${name}.sha256")

          version_info="${release_dir}/${name}.version.txt"
          if [ -f "${artifact}.version.txt" ]; then
            cp "${artifact}.version.txt" "${version_info}"
          else
            printf 'git_sha=%s\ngit_ref=%s\n' "$(git rev-parse HEAD)" "${GITHUB_REF}" > "${version_info}"
          fi
          echo "source_artifact=$(basename "${artifact}")" >> "${version_info}"
          echo "run_id=${GITHUB_RUN_ID}" >> "${version_info}"

          {
            echo "label=${label}"
            echo "name=${name}"
            echo "dir=${release_dir}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v7
        with:
          name: pi-image-${{ steps.assets.outputs.label }}
          path: ${{ steps.assets.outputs.dir }}/*
          if-no-files-found: error
          retention-days: 21

      - name: Replace weekly Pi image release
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.assets.outputs.label }}
          ASSET_NAME: ${{ steps.assets.outputs.name }}
          ASSET_DIR: ${{ steps.assets.outputs.dir }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | select(.tag_name == "weekly-pi-image" or (.tag_name | startswith("pi-image-v"))) | .tag_name' \
            | while IFS= read -r tag; do
                gh release delete "${tag}" --yes --cleanup-tag
              done

          sha="$(git rev-parse HEAD)"
          notes_file="$(mktemp)"
          cat > "${notes_file}" <<EOF_NOTES
          Automated weekly Raspberry Pi image snapshot from \`main\`.

          - Commit: \`${sha}\`
          - Build label: \`${LABEL}\`
          - Asset: \`${ASSET_NAME}\`
          - Flash the image with Raspberry Pi Imager after downloading the release asset.

          Built with \`infra/pi-image/pi-gen/build.sh\`, the same path as local image builds.
          Each run replaces the previous weekly Pi image release.
          EOF_NOTES

          gh release create weekly-pi-image "${ASSET_DIR}"/* \
            --target "${sha}" \
            --title "Weekly Pi Image ${LABEL}" \
            --notes-file "${notes_file}" \
            --latest=false
