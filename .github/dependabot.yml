version: 2
# Monthly version updates as one grouped PR per ecosystem (pip/npm majors stay
# separate PRs), plus one grouped PR per ecosystem for security fixes.
# Not tracked here, bumped by hand: Docker base images (together with
# .python-version/.nvmrc; Python stays on the Pi image's Trixie 3.13 line) and
# firmware/esp/platformio.ini (Dependabot has no PlatformIO ecosystem; see
# firmware/esp/README.md "Platform upgrades").
updates:
  - package-ecosystem: pip
    directory: /apps/server
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      pip:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/ui
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    # "/" covers .github/workflows; the local composite actions pin their own.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

