version: 2
# Monthly version updates as one grouped PR per ecosystem (pip/npm majors stay
# separate PRs), plus one grouped PR per ecosystem for security fixes.
# Docker base images are bumped by hand together with .python-version/.nvmrc.
updates:
  - package-ecosystem: pip
    directory: /apps/server
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      pip:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/ui
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

